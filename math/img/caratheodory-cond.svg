<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350">
  <defs>
    <clipPath id="squareClip">
      <rect x="120" y="80" width="200" height="200" />
    </clipPath>
  </defs>
  <!-- 背景-->
  <rect width="100%" height="100%" fill="#ffffff" />
  <!-- 浅蓝正方形 -->
  <rect x="120" y="80" width="200" height="200" fill="#e8f0fe" />
  <!-- 浅红椭圆 -->
  <ellipse cx="300" cy="180" rx="130" ry="110" fill="#fde2e4" />
  <!-- 交集 -->
  <ellipse cx="300" cy="180" rx="130" ry="110" fill="#e0d1e9" clip-path="url(#squareClip)" />
  <!-- 椭圆描边 -->
  <ellipse cx="300" cy="180" rx="130" ry="110" fill="none" stroke="#333333" stroke-width="2.5" />
  <!-- 正方形描边 -->
  <rect x="120" y="80" width="200" height="200" fill="none" stroke="#333333" stroke-width="2.5" />
  <!-- 文字 -->
  <text x="90" y="185" font-family="'Times New Roman', serif" font-size="24" fill="#333333">T</text>
  <text x="135" y="125" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#333333">T \ E</text>
  <text x="210" y="195" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#333333">T ∩ E</text>
  <text x="445" y="185" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#333333">E</text>
</svg>
